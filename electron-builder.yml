# Electron 打包配置（Windows 安装包）
#
# 目标：给没有电脑基础的人一个「双击 → 装好 → 桌面出现图标 → 双击就玩」的安装包。
# 所以用 oneClick + perMachine:false：双击即装、不弹 UAC、不需要选路径。
appId: com.localholdem.desktop
productName: 德州扑克
copyright: Copyright © 2026 Local Holdem

directories:
  output: release
  buildResources: build

# 直接用本地已解包的 Electron，不让 electron-builder 去 GitHub 下载。
# 原因：它的下载器（got）不读 http_proxy 环境变量，在需要代理的网络下会静默卡死。
electronDist: node_modules/electron/dist

# 只打包运行必需的文件（源码、测试、安卓工程都不进安装包）
files:
  - electron/**/*
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  # electron-builder 支持直接给 png（≥256×256），会自动转成 ico
  icon: public/icons/icon-512.png
  # 文件名用 ASCII，避免 NSIS 在部分系统上的编码问题；用户看到的名字由 productName / shortcutName 决定
  artifactName: Holdem-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  # 必须用 "always"：默认值只在交互式安装时建桌面图标，
  # 静默安装（/S）会跳过，用户装完桌面看不到东西。
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 德州扑克
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerLanguages:
    - zh_CN
